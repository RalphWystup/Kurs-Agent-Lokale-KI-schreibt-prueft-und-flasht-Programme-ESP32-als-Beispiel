<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" font-family="system-ui,Segoe UI,sans-serif" font-size="12" style="max-width:100%;height:auto;background:#f4f3ef;border-radius:10px">
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6962"/></marker></defs>
<text x="20" y="32" font-size="17" font-weight="700">Kurs-Agent — was auf dem Kursrechner läuft: ein Ordner, kein Internet, nichts installiert</text>
<rect x="20" y="60" width="240" height="70" rx="8" fill="#fff3c4" stroke="#c9a227" stroke-width="1.5"/>
<text x="32" y="83" font-weight="700" font-size="13.5">START.bat — der Schalter</text>
<text x="32" y="104" font-size="12" fill="#3b3a36">Fenster offen = Kurs läuft</text>
<text x="32" y="121" font-size="12" fill="#3b3a36">Fenster zu = alles aus</text>
<rect x="330" y="60" width="350" height="80" rx="8" fill="#efe6f7" stroke="#6a3d9a" stroke-width="1.5"/>
<text x="342" y="83" font-weight="700" font-size="13.5">Modellserver · llama-server · :8099</text>
<text x="342" y="104" font-size="12" fill="#3b3a36">Qwen2.5-7B-Instruct Q4_K_M (4,7 GB)</text>
<text x="342" y="121" font-size="12" fill="#3b3a36">schreibt nur Text, führt nichts aus</text>
<rect x="740" y="60" width="340" height="230" rx="8" fill="#f4f3ef" stroke="#a19e94" stroke-width="1.5"/>
<text x="752" y="83" font-weight="700" font-size="13.5">Entwicklung — nicht Teil des Systems</text>
<text x="752" y="104" font-size="12" fill="#3b3a36">Brücke: beobachtet, misst, spielt ein</text>
<text x="752" y="121" font-size="12" fill="#3b3a36">Tor einspielen.py: nichts nach C: ohne</text>
<text x="752" y="138" font-size="12" fill="#3b3a36">   Messung, Quelle und Freigabe</text>
<text x="752" y="155" font-size="12" fill="#3b3a36">Regelwächter: prüft jeden Schritt</text>
<text x="752" y="172" font-size="12" fill="#3b3a36">   der KI gegen die Anforderungen</text>
<text x="752" y="189" font-size="12" fill="#3b3a36">Im Kurs läuft davon nichts.</text>
<rect x="20" y="190" width="290" height="190" rx="8" fill="#e8f0fb" stroke="#1f4e9e" stroke-width="1.5"/>
<text x="32" y="213" font-weight="700" font-size="13.5">Frage.html im Browser</text>
<text x="32" y="234" font-size="12" fill="#3b3a36">1 LLM-Eingabe (An das LLM, Agent)</text>
<text x="32" y="251" font-size="12" fill="#3b3a36">2 LLM-Ausgabe, Wort für Wort</text>
<text x="32" y="268" font-size="12" fill="#3b3a36">3 Interpreter-Eingabe (Python)</text>
<text x="32" y="285" font-size="12" fill="#3b3a36">4 Interpreter-Ausgabe, Befehle</text>
<text x="32" y="302" font-size="12" fill="#3b3a36">5 Direkt am ESP32 (Terminal)</text>
<text x="32" y="319" font-size="12" fill="#3b3a36">Der Agent läuft in dieser Seite</text>
<text x="32" y="336" font-size="12" fill="#3b3a36">Abbruch · Leeren · Fortschritt</text>
<rect x="330" y="200" width="350" height="120" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/>
<text x="342" y="223" font-weight="700" font-size="13.5">Diener · agent\oberflaeche.py · :8777</text>
<text x="342" y="244" font-size="12" fill="#3b3a36">liefert die Seite, startet je ein Werkzeug</text>
<text x="342" y="261" font-size="12" fill="#3b3a36">hält die Leitung zum Brett (Terminal)</text>
<text x="342" y="278" font-size="12" fill="#3b3a36">schreibt ablage\protokoll_testen.txt</text>
<text x="342" y="295" font-size="12" fill="#3b3a36">startet und beendet den Modellserver</text>
<rect x="330" y="400" width="350" height="130" rx="8" fill="#ffffff" stroke="#6b6962" stroke-width="1.5"/>
<text x="342" y="423" font-weight="700" font-size="13.5">Python des Kurses · ablage\python</text>
<text x="342" y="444" font-size="12" fill="#3b3a36">Interpreter: python.exe -m py_compile</text>
<text x="342" y="461" font-size="12" fill="#3b3a36">Simulator: programm_testen</text>
<text x="342" y="478" font-size="12" fill="#3b3a36">Werkzeuge: esp32_laden (Prüfsumme),</text>
<text x="342" y="495" font-size="12" fill="#3b3a36">esp32_firmware, esp32_nachlesen,</text>
<text x="342" y="512" font-size="12" fill="#3b3a36">ports_zeigen</text>
<rect x="740" y="400" width="340" height="130" rx="8" fill="#fde8e6" stroke="#b3261e" stroke-width="1.5"/>
<text x="752" y="423" font-weight="700" font-size="13.5">ESP32-WROOM-32 · COM3 (CH340)</text>
<text x="752" y="444" font-size="12" fill="#3b3a36">MicroPython v1.29 · main.py</text>
<text x="752" y="461" font-size="12" fill="#3b3a36">LED an GPIO 2</text>
<text x="752" y="478" font-size="12" fill="#3b3a36">meldet Banner und &gt;&gt;&gt;</text>
<text x="752" y="495" font-size="12" fill="#3b3a36">Strg+B · Strg+C · Betriebssystem</text>
<line x1="140" y1="130" x2="140" y2="190" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)"/>
<text x="150" y="165" font-size="11" fill="#6b6962" text-anchor="start">öffnet die Seite</text>
<line x1="260" y1="110" x2="330" y2="222" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)"/>
<text x="268" y="150" font-size="11" fill="#6b6962" text-anchor="end">startet</text>
<line x1="310" y1="268" x2="330" y2="268" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)" marker-start="url(#p)"/>
<text x="320" y="257" font-size="10" fill="#6b6962" text-anchor="middle">HTTP</text>
<line x1="310" y1="212" x2="400" y2="140" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)" marker-start="url(#p)"/>
<text x="372" y="178" font-size="11" fill="#6b6962" text-anchor="start">Streaming</text>
<line x1="505" y1="200" x2="505" y2="140" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)"/>
<text x="515" y="175" font-size="11" fill="#6b6962" text-anchor="start">startet · beendet</text>
<line x1="505" y1="320" x2="505" y2="400" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)"/>
<text x="515" y="365" font-size="11" fill="#6b6962" text-anchor="start">startet je Werkzeug als Prozess</text>
<line x1="680" y1="465" x2="740" y2="465" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)" marker-start="url(#p)"/>
<text x="710" y="455" font-size="11" fill="#6b6962" text-anchor="middle">COM3</text>
<line x1="680" y1="300" x2="900" y2="400" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)" marker-start="url(#p)"/>
<text x="800" y="338" font-size="11" fill="#6b6962" text-anchor="middle">Terminal (seriell)</text>
<rect x="20" y="560" width="1060" height="215" rx="8" fill="#fff" stroke="#1f4e9e" stroke-width="1.5"/>
<text x="32" y="585" font-weight="700" font-size="14">Der Agent — in der Seite, nach seinen Schritten, höchstens drei Runden</text>
<rect x="32" y="600" width="109" height="40" rx="6" fill="#e8f0fb" stroke="#1f4e9e"/>
<text x="86.5" y="625" font-size="11.5" text-anchor="middle">1 Prompt → LLM</text>
<line x1="141" y1="620" x2="157" y2="620" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="157" y="600" width="194" height="40" rx="6" fill="#e8f0fb" stroke="#1f4e9e"/>
<text x="254.0" y="625" font-size="11.5" text-anchor="middle">2 Code → Interpreter-Eingabe</text>
<line x1="351" y1="620" x2="367" y2="620" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="367" y="600" width="182" height="40" rx="6" fill="#e8f0fb" stroke="#1f4e9e"/>
<text x="458.0" y="625" font-size="11.5" text-anchor="middle">3 Interpreter (py_compile)</text>
<line x1="549" y1="620" x2="565" y2="620" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="565" y="600" width="213" height="40" rx="6" fill="#e8f0fb" stroke="#1f4e9e"/>
<text x="671.5" y="625" font-size="11.5" text-anchor="middle">4 Simulator: läuft ohne Fehler?</text>
<rect x="32" y="662" width="347" height="40" rx="6" fill="#e8f0fb" stroke="#1f4e9e"/>
<text x="205.5" y="687" font-size="11.5" text-anchor="middle">5 Brett meldet sich? Strg+B · Strg+C · Betriebssystem</text>
<line x1="379" y1="682" x2="395" y2="682" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="395" y="662" width="274" height="40" rx="6" fill="#e8f0fb" stroke="#1f4e9e"/>
<text x="532.0" y="687" font-size="11.5" text-anchor="middle">6 Freigabe &gt;&gt;&gt; → Aufspielen mit Prüfsumme</text>
<line x1="669" y1="682" x2="685" y2="682" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="685" y="662" width="158" height="40" rx="6" fill="#e8f0fb" stroke="#1f4e9e"/>
<text x="764.0" y="687" font-size="11.5" text-anchor="middle">7 Traceback vom Brett?</text>
<line x1="843" y1="682" x2="859" y2="682" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)"/>
<rect x="859" y="662" width="133" height="40" rx="6" fill="#e8f0fb" stroke="#1f4e9e"/>
<text x="925.5" y="687" font-size="11.5" text-anchor="middle">8 STATUS BESTANDEN</text>
<path d="M 778 620 L 808 620 L 808 650 L 20 650 L 20 682 L 32 682" fill="none" stroke="#6b6962" stroke-width="1.6" marker-end="url(#p)"/>
<path d="M 932 702 L 932 722 L 100 722 L 100 648" fill="none" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#p)"/>
<text x="120" y="739" font-size="11.5" fill="#b3261e">Jede Fehlermeldung (Interpreter, Simulator, Traceback) geht als Anhang zum alten Prompt zurück ans LLM — nächste Runde.</text>
<text x="120" y="757" font-size="11.5" fill="#b3261e">Schweigt das Brett auch mit neuem Betriebssystem, endet der Lauf mit Befund: Hardware, kein Fall für das LLM.</text>
<text x="1080" y="793" font-size="11" fill="#6b6962" text-anchor="end">Prof. Dr.-Ing. Ralph Wystup M.Sc. und Claude (Anthropic, Claude Code) — gemeinsam erstellt · 16.10.2026</text>
</svg>